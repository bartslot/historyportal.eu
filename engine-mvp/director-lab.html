<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Director Lab</title>
<style>
  :root { --paper: #efe9dc; --ink: #1c1418; }
  html, body { margin: 0; background: var(--paper); font: 13px/1.35 system-ui, sans-serif; color: var(--ink); }
  #wrap { position: relative; width: min(100vw, 1280px); aspect-ratio: 16 / 9; }
  #stage { width: 100%; height: 100%; display: block; }
  #intro-host { position: absolute; inset: 0; pointer-events: none; }
  #intro-host:has(iframe) { pointer-events: auto; }
  #bar { display: flex; gap: 6px; padding: 8px; }
  button { border: 1px solid #0003; background: #fff; border-radius: 999px; padding: 3px 12px; cursor: pointer; }
  #hud { padding: 6px 8px; background: var(--ink); color: #fff; min-height: 1.35em; }
  #panel { padding: 0 8px; }
  #panel td { padding: 1px 8px 1px 0; }
  #state { padding: 8px; font: 11px/1.3 ui-monospace, monospace; white-space: pre; }
</style>
</head>
<body>
<div id="wrap"><canvas id="stage" width="1280" height="720"></canvas><div id="intro-host"></div></div>
<div id="hud"></div>
<div id="bar"><button id="play">Play</button><button id="pause">Pause</button><button id="mute">Mute</button><button id="intro">Intro</button></div>
<div id="panel"></div>
<div id="state"></div>
<script type="module" src="/src/director/lab.ts"></script>
</body>
</html>
