<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Puppet Lab</title>
<style>
  :root { --paper: #efe9dc; --ink: #1c1418; --panel: rgba(255, 255, 255, 0.86); }
  html, body { margin: 0; height: 100%; background: var(--paper); font: 13px/1.3 system-ui, sans-serif; color: var(--ink); }
  canvas { width: 100%; height: 100%; display: block; outline: none; }
  #ui { position: fixed; top: 12px; right: 12px; width: 250px; max-height: calc(100% - 48px); overflow: auto; padding: 12px; border-radius: 12px; background: var(--panel); }
  #ui label { display: grid; grid-template-columns: 1fr 44px; gap: 2px 8px; margin: 6px 0; }
  #ui input[type=range] { grid-column: 1 / 3; width: 100%; }
  #ui .row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  #ui button { border: 1px solid #0003; background: #fff; border-radius: 999px; padding: 3px 10px; cursor: pointer; }
  #msg { position: fixed; left: 12px; bottom: 12px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"></div>
<div id="msg">Loading…</div>
<script type="module" src="/src/lab/puppet-lab.ts"></script>
</body>
</html>
