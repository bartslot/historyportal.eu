<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Les</title>
<link rel="icon" href="data:,">
<style>
  :root { --paper: #efe9dc; --ink: #1c1418; }
  html, body { margin: 0; height: 100%; background: var(--ink); overflow: hidden; }
  #frame { position: fixed; inset: 0; display: grid; place-items: center; }
  #wrap { position: relative; width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; background: var(--paper); }
  #stage { width: 100%; height: 100%; display: block; outline: none; }
  #intro-host { position: absolute; inset: 0; pointer-events: none; }
  #intro-host:has(iframe) { pointer-events: auto; }
  #start { position: absolute; inset: 0; display: grid; place-items: center; background: transparent; border: 0; cursor: pointer;
    font: 600 28px/1 system-ui, sans-serif; color: var(--paper); }
  #start span { padding: 14px 28px; border-radius: 999px; background: var(--ink); }
  #start[hidden] { display: none; }
  #error { position: absolute; left: 16px; bottom: 16px; color: var(--paper); font: 14px system-ui, sans-serif; }
</style>
</head>
<body>
<div id="frame"><div id="wrap">
  <canvas id="stage"></canvas>
  <div id="intro-host"></div>
  <button id="start" hidden><span>Start</span></button>
  <div id="error"></div>
</div></div>
<script type="module" src="/src/play/play.ts"></script>
</body>
</html>
