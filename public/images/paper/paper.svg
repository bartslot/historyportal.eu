<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Paper tooth: a faint warm grain tiled behind the painted pictures. Seamless (stitchTiles). -->
  <filter id="tooth" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" seed="2" stitchTiles="stitch" result="g"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="9" stitchTiles="stitch" result="m"/>
    <feComposite in="g" in2="m" operator="arithmetic" k2="0.7" k3="0.3" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.38  0 0 0 0 0.28  -0.6 0 0 0 0.42"/>
  </filter>
  <rect width="512" height="512" filter="url(#tooth)"/>
</svg>
