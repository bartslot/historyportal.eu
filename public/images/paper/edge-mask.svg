<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="none">
  <!-- The painted edge of a lesson picture, used as a CSS mask (alpha). A wash that stops
       irregularly before the paper's edge: a wobbly outline, ragged fibres, a soft bleed. -->
  <defs>
    <filter id="edge" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.006 0.009" numOctaves="3" seed="11" result="coarse"/>
      <feDisplacementMap in="SourceGraphic" in2="coarse" scale="110" xChannelSelector="R" yChannelSelector="G" result="wobble"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" seed="4" result="fine"/>
      <feDisplacementMap in="wobble" in2="fine" scale="26" xChannelSelector="R" yChannelSelector="G" result="ragged"/>
      <feGaussianBlur in="ragged" stdDeviation="3" result="crisp"/>
      <feGaussianBlur in="wobble" stdDeviation="26" result="bleed"/>
      <feComponentTransfer in="bleed" result="halo"><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feMerge><feMergeNode in="halo"/><feMergeNode in="crisp"/></feMerge>
    </filter>
  </defs>
  <rect x="70" y="56" width="1460" height="788" rx="40" fill="#fff" filter="url(#edge)"/>
</svg>
