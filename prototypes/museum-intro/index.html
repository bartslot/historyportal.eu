<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Museum intro (prototype)</title>
    <style>
      :root {
        --ink: #17120d;
        --paper: #f6ecd6;
        --amber: #f2b33d;
      }
      html, body { margin: 0; height: 100%; background: #24211d; overflow: hidden; font-family: Georgia, 'Times New Roman', serif; }
      #stage, #stage canvas { position: fixed; inset: 0; display: block; }
      #fade { position: fixed; inset: 0; background: #0d0b09; pointer-events: none; }
      #loader { position: fixed; left: 50%; top: 50%; width: min(240px, 60vw); height: 2px; transform: translate(-50%, -50%); background: rgba(246, 236, 214, 0.15); transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
      #load-bar { height: 100%; background: var(--paper); transform: scaleX(0); transform-origin: left; transition: transform 0.25s cubic-bezier(0.2, 0, 0, 1); }
      body.ready #loader { opacity: 0; }
      #error { position: fixed; left: 16px; right: 16px; top: 50%; color: var(--paper); text-align: center; }

      /* comic balloon: silent text (narrator-only rule), tail points down-left to Tasman's mouth */
      #balloon { position: fixed; left: 0; top: 0; opacity: 0; transform-origin: 0 100%; pointer-events: none; }
      #balloon span { position: absolute; left: 14px; bottom: 18px; white-space: nowrap; padding: 10px 18px 11px; background: var(--paper); color: var(--ink); border: 2.5px solid var(--ink); border-radius: 999px; font-size: clamp(17px, 2.4vw, 26px); font-style: italic; }
      #balloon i { position: absolute; left: 0; bottom: 0; width: 26px; height: 26px; }

      #ripple { position: fixed; left: 0; top: 0; width: 120px; height: 120px; border-radius: 50%; border: 3px solid var(--ink); opacity: 0; pointer-events: none; }

      #start { position: fixed; left: 50%; bottom: max(28px, env(safe-area-inset-bottom)); opacity: 0; display: inline-flex; align-items: center; gap: 10px; padding: 14px 28px; border: 0; border-radius: 999px; background: var(--amber); color: var(--ink); font: 600 18px/1 system-ui, sans-serif; cursor: pointer; }
      #start svg { width: 18px; height: 18px; }
      #start:hover { filter: brightness(1.06); }
      #start:focus-visible { outline: 2px solid var(--paper); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="ripple"></div>
    <div id="balloon">
      <i><svg viewBox="0 0 26 26"><path d="M2 25 L10 4 L22 6 Z" fill="#f6ecd6" stroke="#17120d" stroke-width="2.5" stroke-linejoin="round" /></svg></i>
      <span></span>
    </div>
    <button id="start" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linejoin="round" d="M6 4.5v15l13-7.5-13-7.5Z" /></svg>
      Start
    </button>
    <div id="fade"></div>
    <div id="loader"><div id="load-bar"></div></div>
    <div id="error" role="alert"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
